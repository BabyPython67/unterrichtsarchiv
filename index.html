<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121619" media="(prefers-color-scheme: dark)">
  <title>Unterrichtsarchiv</title>
  <link rel="stylesheet" href="./ui/stil.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Unterricht">
</head>
<body>
  <header class="kopf">
    <div class="kopf-zeile">
      <h1>Unterrichtsarchiv</h1>
      <div class="kopf-knoepfe">
        <button type="button" id="knopf-einstellungen" aria-pressed="false">Einstellungen</button>
      </div>
    </div>
    <p class="stand" id="stand"></p>
    <nav class="reiter" aria-label="Ansicht">
      <button type="button" id="reiter-archiv" aria-pressed="true">Archiv</button>
      <button type="button" id="reiter-vorschau" aria-pressed="false">Vorschau</button>
      <button type="button" id="reiter-eintragen" aria-pressed="false">Eintragen</button>
    </nav>
  </header>

  <div id="webapp-hinweis" class="hinweis warn app-hinweis" hidden></div>

  <div id="erinnerung" class="erinnerung" hidden></div>

  <div id="meldung" class="meldung" role="status" hidden></div>

  <div id="neuigkeiten" class="neuigkeiten" hidden></div>

  <div id="liste-bereich">
    <div class="archiv-kopf" id="archiv-kopf" hidden></div>

    <div class="werkzeuge" id="werkzeuge">
      <input type="search" id="suche" placeholder="In allen Kursen suchen" autocomplete="off" aria-label="Suche in allen Kursen">
      <button type="button" id="filter-knopf" aria-expanded="false" aria-controls="filter">Filter</button>
    </div>

    <section class="filter" id="filter" aria-label="Filter" hidden></section>
    <div class="filter-aktiv" id="filter-aktiv" hidden></div>

    <main id="ausgabe"></main>
  </div>

  <section id="vorschau" class="vorschau" hidden aria-label="Schultag-Vorschau"></section>

  <section id="eintragen" class="eintragen" hidden aria-label="Hausaufgabe eintragen"></section>

  <section id="einstellungen" class="einstellungen" hidden aria-label="Einstellungen"></section>

  <input type="file" id="datei" accept=".json,application/json" multiple hidden>

  <script type="module" src="./ui/app.js"></script>
</body>
</html>
